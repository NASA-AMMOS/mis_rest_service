# SonarQube Cloud configuration for mis_rest_service
#
# Set up per the AMMOS scanning guide:
#   https://wiki.jpl.nasa.gov/display/AmmosArch/Code+Vulnerability+Scanning+Set+Up+for+AMMOS+Open+Source+Software
sonar.projectKey=NASA-AMMOS_mis_rest_service
sonar.organization=nasa-ammos

# Project metadata. projectVersion is overridden from pom.xml by the
# Security-Scan workflow.
sonar.projectName=mis_rest_service
sonar.projectVersion=6.5.4
sonar.projectDescription=ASTRIA Image Sampler - REST service and CLI for sampling pixel (DN) values out of VICAR planetary images.

# Project links - shown in the SonarQube Cloud UI
sonar.links.scm=https://github.com/NASA-AMMOS/mis_rest_service
sonar.links.issue=https://github.com/NASA-AMMOS/mis_rest_service/issues
sonar.links.ci=https://github.com/NASA-AMMOS/mis_rest_service/actions

# ==========================================
# Analysis scope
# ==========================================
# Our own code only: the Java servlet/CLI and the servlet deployment
# descriptors. There is no vendored third-party Java in this repo.
#
# Deliberately not listed: docs/ (a generated PDF) and scripts/ (pandoc/LaTeX
# helpers that build that PDF).
sonar.sources=src/main,webapp

# test/ holds shell scripts that drive the built artifacts, not a JUnit suite,
# so there is nothing to declare as sonar.tests.

sonar.exclusions=\
  target/**,\
  webapp/resources/**,\
  **/*.min.js,\
  **/*.pdf,\
  **/*.png,\
  **/*.jpg

# Duplication exclusions - deployment descriptors repeat by design, one per
# Maven profile.
sonar.cpd.exclusions=\
  webapp/WEB-INF/**

# ==========================================
# Java bytecode
# ==========================================
# The Security-Scan workflow compiles the project when every dependency in
# pom.xml resolves from public repositories, which leaves the classes in
# target/classes. While any dependency is not yet publicly available, it skips
# the build and creates target/classes empty, so the Java
# analyzer runs on source alone: rules that need resolved types produce fewer and
# less precise findings, and CodeQL carries most of the security signal.
#
# Either way this file does not change. Pointing sonar.java.binaries at a real
# (if empty) directory avoids the "Missing 'sonar.java.binaries' property"
# warning on source-only runs.
sonar.java.binaries=target/classes
sonar.java.source=21

sonar.sourceEncoding=UTF-8

sonar.tags=planetary,nasa,imagery,java,vicar,rest-api

# New Code: anything added in the last 30 days counts as new.
sonar.leak.period=30

# sonar.sarifReportPaths is supplied by the Security-Scan workflow, which
# passes the repaired CodeQL reports on the scanner command line.
